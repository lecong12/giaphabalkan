<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gia phả Balkan</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
        }
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin: 12px 16px 0;
        }
        #toolbar h1 {
            flex: 1 0 100%;
            margin: 0 0 2px;
            font-size: 20px;
        }
        #search-name, #toolbar button {
            min-height: 38px;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 8px 12px;
            font: inherit;
        }
        #search-name {
            width: min(320px, 65vw);
            background: #252525;
            color: #fff;
        }
        #toolbar button {
            background: #303030;
            color: #fff;
            cursor: pointer;
        }
        #toolbar button:hover { background: #444; }
        #status, #data-note {
            flex: 1 0 100%;
            margin: 0;
            line-height: 1.5;
        }
        #status.success { color: #00e676; }
        #status.error { color: #ff6b6b; }
        #data-note { color: #ffd166; }
        #tree {
            width: 100%;
            height: calc(100vh - 140px);
            min-height: 450px;
            overflow: hidden;
            cursor: grab;
        }
        #tree:active { cursor: grabbing; }
        #tree svg { display: block; width: 100%; height: 100%; }
        .link {
            fill: none;
            stroke: #777;
            stroke-width: 1.5px;
        }
        .link.mother {
            stroke: #e78ac3;
            stroke-dasharray: 5 4;
        }
        .link.partner {
            stroke: #56b4e9;
            stroke-dasharray: 2 4;
        }
        .person rect {
            stroke-width: 1.5px;
        }
        .person.male rect {
            fill: #183b56;
            stroke: #56b4e9;
        }
        .person.female rect {
            fill: #55294c;
            stroke: #e78ac3;
        }
        .person.unknown rect {
            fill: #383838;
            stroke: #aaa;
        }
        .person text {
            fill: #fff;
            text-anchor: middle;
            pointer-events: none;
        }
        .person .name {
            font-size: 13px;
            font-weight: 600;
        }
        .person .detail {
            fill: #ddd;
            font-size: 10px;
        }
        @media (max-width: 600px) {
            #toolbar { margin: 10px; }
            #tree { height: 72vh; min-height: 380px; }
        }
    </style>
</head>
<body>
    <section id="toolbar" aria-live="polite">
        <h1>Gia phả Balkan</h1>
        <input id="search-name" type="search" placeholder="Tìm theo họ tên..." aria-label="Tìm theo họ tên">
        <button id="search-button" type="button">Tìm người</button>
        <button id="zoom-in-button" type="button" aria-label="Phóng to">+</button>
        <button id="zoom-out-button" type="button" aria-label="Thu nhỏ">−</button>
        <button id="fit-button" type="button">Thu nhỏ xem toàn cây</button>
        <p id="status">Đang tải dữ liệu gia phả...</p>
        <p id="data-note"></p>
    </section>
    <div id="tree" aria-label="Sơ đồ gia phả"></div>

    <script>
        const spreadsheetId = '1KgxSyIETIPPO7P_tBUcK7bRO4Ej4b863A-skdMHLMYM';
        const sheetGid = '0';
        const dDataGid = '1565376107';
        const statusElement = document.getElementById('status');
        const noteElement = document.getElementById('data-note');
        const treeElement = document.getElementById('tree');
        const searchElement = document.getElementById('search-name');
        let renderedPeople = [];
        let chartState;

        function normalizeHeader(value) {
            return String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLocaleLowerCase('vi')
                .replace(/[^a-z0-9]/g, '');
        }

        function getCell(row, index) {
            const value = row && row.c && row.c[index] ? row.c[index].v : null;
            return value === null || value === undefined ? '' : String(value).trim();
        }

        function parseSheetResponse(text) {
            const start = text.indexOf('{');
            const end = text.lastIndexOf('}');
            if (start < 0 || end <= start) {
                throw new Error('Google Sheets trả về dữ liệu không hợp lệ.');
            }

            const response = JSON.parse(text.slice(start, end + 1));
            if (!response.table || !Array.isArray(response.table.cols) || !Array.isArray(response.table.rows)) {
                throw new Error('Không tìm thấy danh sách thành viên trong Google Sheets.');
            }
            return response.table;
        }

        function getColumnIndexes(columns) {
            const aliases = {
                id: ['id', 'personid', 'memberid', 'maid'],
                full_name: ['fullname', 'name', 'hoten', 'hovaten', 'ten'],
                gender: ['gender', 'sex', 'gioitinh'],
                fid: ['fid', 'fatherid', 'idfather', 'mach', 'idcha'],
                mid: ['mid', 'motherid', 'idmother', 'mame', 'idme'],
                pid: ['pid', 'partnerid', 'spouseid', 'idpartner', 'idvochong'],
                branch: ['branch', 'chinhanh', 'nhanh'],
                generation: ['generation', 'thehe', 'doi']
            };
            const indexes = new Map();

            columns.forEach((column, index) => {
                const header = normalizeHeader(column.label || column.id);
                for (const [field, names] of Object.entries(aliases)) {
                    if (names.includes(header) && !indexes.has(field)) {
                        indexes.set(field, index);
                    }
                }
            });

            const missing = ['id', 'full_name', 'gender'].filter(field => !indexes.has(field));
            if (missing.length) {
                throw new Error(`Google Sheets thiếu cột bắt buộc: ${missing.join(', ')}.`);
            }
            return indexes;
        }

        function toGender(value) {
            const normalized = value.toLocaleLowerCase('vi');
            if (normalized === 'nam' || normalized === 'male') return 'male';
            if (normalized === 'nữ' || normalized === 'nu' || normalized === 'female') return 'female';
            return 'unknown';
        }

        function drawTree(people, mothers) {
            const peopleById = new Map(people.map(person => [person.id, { ...person, children: [] }]));
            const mothersById = new Map(mothers.map(person => [
                person.id,
                { ...person, id: `dData:${person.id}`, sourceId: person.id, isMotherRecord: true, children: [] }
            ]));
            const roots = [];
            const motherEdges = [];
            const partnerEdges = [];
            let fatherLinks = 0;
            let unmatchedFatherLinks = 0;
            let motherLinks = 0;
            let unmatchedMotherLinks = 0;

            for (const person of peopleById.values()) {
                if (person.fatherId) {
                    const father = peopleById.get(person.fatherId);
                    if (father && father.id !== person.id) {
                        father.children.push(person);
                        fatherLinks++;
                    } else {
                        roots.push(person);
                        unmatchedFatherLinks++;
                    }
                } else {
                    roots.push(person);
                }

                if (person.motherId) {
                    const mother = mothersById.get(person.motherId);
                    if (mother && mother.id !== person.id) {
                        motherLinks++;
                        motherEdges.push([mother, person]);
                    } else {
                        unmatchedMotherLinks++;
                    }
                }
            }
            for (const mother of mothersById.values()) {
                roots.push(mother);
                const partner = peopleById.get(mother.partnerId);
                if (partner && partner.id !== mother.id) {
                    partnerEdges.push([mother, partner]);
                }
            }

            if (typeof d3 === 'undefined') {
                throw new Error('Không tải được thư viện vẽ sơ đồ. Hãy kiểm tra kết nối mạng.');
            }

            const virtualRoot = { id: '__family_root__', children: roots };
            const hierarchy = d3.hierarchy(virtualRoot, person => person.children);
            d3.tree().nodeSize([190, 100])(hierarchy);

            const visibleNodes = hierarchy.descendants().filter(node => node.data.id !== virtualRoot.id);
            const hierarchyNodesById = new Map(visibleNodes.map(node => [node.data.id, node]));
            const visibleLinks = hierarchy.links().filter(link => link.source.data.id !== virtualRoot.id);
            const visibleMotherLinks = motherEdges
                .map(([mother, child]) => ({
                    source: hierarchyNodesById.get(mother.id),
                    target: hierarchyNodesById.get(child.id)
                }))
                .filter(link => link.source && link.target);
            const visiblePartnerLinks = partnerEdges
                .map(([mother, partner]) => ({
                    source: hierarchyNodesById.get(mother.id),
                    target: hierarchyNodesById.get(partner.id)
                }))
                .filter(link => link.source && link.target);
            const minX = d3.min(visibleNodes, node => node.x);
            const maxX = d3.max(visibleNodes, node => node.x);
            const minY = d3.min(visibleNodes, node => node.y);
            const maxY = d3.max(visibleNodes, node => node.y);
            const padding = 60;
            const nodeWidth = 164;
            const nodeHeight = 54;
            const width = maxX - minX + nodeWidth + padding * 2;
            const height = maxY - minY + nodeHeight + padding * 2;

            treeElement.replaceChildren();
            const svg = d3.select(treeElement)
                .append('svg')
                .attr('viewBox', `0 0 ${width} ${height}`)
                .attr('role', 'img')
                .attr('aria-label', 'Sơ đồ gia phả; kéo để di chuyển, cuộn để phóng to hoặc thu nhỏ');

            const zoomLayer = svg.append('g');
            const viewport = zoomLayer.append('g')
                .attr('transform', `translate(${padding - minX},${padding - minY})`);

            viewport.append('g')
                .selectAll('path')
                .data(visibleLinks)
                .join('path')
                .attr('class', 'link')
                .attr('d', d3.linkVertical()
                    .x(point => point.x)
                    .y(point => point.y));

            viewport.append('g')
                .selectAll('path')
                .data(visibleMotherLinks)
                .join('path')
                .attr('class', 'link mother')
                .attr('d', d3.linkVertical()
                    .x(point => point.x)
                    .y(point => point.y));

            viewport.append('g')
                .selectAll('path')
                .data(visiblePartnerLinks)
                .join('path')
                .attr('class', 'link partner')
                .attr('d', d3.linkHorizontal()
                    .x(point => point.x)
                    .y(point => point.y));

            const personNodes = viewport.append('g')
                .selectAll('g')
                .data(visibleNodes)
                .join('g')
                .attr('class', node => `person ${node.data.gender}`)
                .attr('transform', node => `translate(${node.x},${node.y})`);

            personNodes.append('title')
                .text(node => [node.data.name, node.data.branch, node.data.generation].filter(Boolean).join(' - '));
            personNodes.append('rect')
                .attr('x', -nodeWidth / 2)
                .attr('y', -nodeHeight / 2)
                .attr('width', nodeWidth)
                .attr('height', nodeHeight)
                .attr('rx', 8);
            personNodes.append('text')
                .attr('class', 'name')
                .attr('y', -3)
                .text(node => node.data.name);
            personNodes.append('text')
                .attr('class', 'detail')
                .attr('y', 15)
                .text(node => [node.data.branch, node.data.generation].filter(Boolean).join(' - '));
            personNodes
                .style('cursor', 'pointer')
                .on('click', (event, node) => {
                    focusNode(node);
                    noteElement.textContent = `Đang xem: ${node.data.name}`;
                });

            const zoom = d3.zoom()
                .scaleExtent([0.0001, 10000])
                .on('zoom', event => zoomLayer.attr('transform', event.transform));
            svg.call(zoom);

            const fitScale = Math.min(treeElement.clientWidth / width, treeElement.clientHeight / height);
            chartState = { svg, zoom, width, height, minX, minY, padding, visibleNodes, fitScale };
            renderedPeople = visibleNodes.map(node => node.data);

            statusElement.textContent = `Đã hiển thị ${visibleNodes.length} thành viên; nối được ${fatherLinks} quan hệ cha, ${motherLinks} quan hệ mẹ và ${visiblePartnerLinks.length} quan hệ vợ/chồng. Kéo để di chuyển, cuộn để phóng to/thu nhỏ.`;
            statusElement.className = 'success';

            const notes = [];
            if (unmatchedFatherLinks || unmatchedMotherLinks || visiblePartnerLinks.length !== partnerEdges.length) {
                notes.push(`${unmatchedFatherLinks} liên kết cha, ${unmatchedMotherLinks} liên kết mẹ và ${partnerEdges.length - visiblePartnerLinks.length} liên kết vợ/chồng không khớp ID.`);
            }
            if (people.length + mothers.length !== visibleNodes.length) {
                notes.push('Một số thành viên không thể đưa vào sơ đồ do quan hệ bị lỗi hoặc vòng lặp.');
            }
            noteElement.textContent = notes.join(' ');

            const firstAncestor = visibleNodes.find(node => !node.data.isMotherRecord && !node.data.fatherId)
                || visibleNodes.find(node => !node.data.isMotherRecord);
            if (firstAncestor) {
                focusNode(firstAncestor, false);
            }
        }

        function focusNode(node, animate = true) {
            if (!node || !chartState) return;

            const x = node.x - chartState.minX + chartState.padding;
            const y = node.y - chartState.minY + chartState.padding;
            const scale = 0.9 / chartState.fitScale;
            const transform = d3.zoomIdentity
                .translate(chartState.width / 2 - x * scale, chartState.height / 2 - y * scale)
                .scale(scale);
            const selection = animate ? chartState.svg.transition().duration(400) : chartState.svg;
            selection.call(chartState.zoom.transform, transform);
        }

        function focusPerson() {
            const query = searchElement.value.trim().toLocaleLowerCase('vi');
            if (!query || !chartState) return;

            const person = renderedPeople.find(item => item.name.toLocaleLowerCase('vi').includes(query));
            if (!person) {
                noteElement.textContent = `Không tìm thấy thành viên có tên chứa "${searchElement.value.trim()}".`;
                return;
            }

            const node = chartState.visibleNodes.find(item => item.data.id === person.id);
            focusNode(node);
            noteElement.textContent = `Đang xem: ${person.name}`;
        }

        async function loadFamilyTree() {
            try {
                if (typeof d3 === 'undefined') {
                    throw new Error('Không tải được thư viện vẽ sơ đồ. Hãy kiểm tra kết nối mạng.');
                }

                const fetchTable = async gid => {
                    const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:json&gid=${gid}`;
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error(`Không thể tải tab Google Sheets (gid=${gid}, HTTP ${response.status}).`);
                    }
                    return parseSheetResponse(await response.text());
                };
                const [mainTable, motherTable] = await Promise.all([
                    fetchTable(sheetGid),
                    fetchTable(dDataGid)
                ]);
                const mainColumns = getColumnIndexes(mainTable.cols);
                const motherColumns = getColumnIndexes(motherTable.cols);

                const readRecords = (table, columns, includeRelationships) => {
                    const records = new Map();
                    let skippedRows = 0;
                    let duplicateIds = 0;
                    for (const row of table.rows) {
                        const readField = field => columns.has(field) ? getCell(row, columns.get(field)) : '';
                        const id = readField('id');
                        const name = readField('full_name');
                        if (!id || !name) {
                            skippedRows++;
                            continue;
                        }
                        if (records.has(id)) {
                            duplicateIds++;
                            continue;
                        }
                        records.set(id, {
                            id,
                            name,
                            gender: toGender(readField('gender')),
                            fatherId: includeRelationships ? readField('fid') : '',
                            motherId: includeRelationships ? readField('mid') : '',
                            partnerId: includeRelationships ? '' : readField('pid'),
                            branch: readField('branch'),
                            generation: readField('generation')
                        });
                    }
                    return { records, skippedRows, duplicateIds };
                };

                const mainData = readRecords(mainTable, mainColumns, true);
                const motherData = readRecords(motherTable, motherColumns, false);
                if (mainData.records.size === 0) {
                    throw new Error('Không có thành viên hợp lệ để hiển thị.');
                }

                if (motherData.records.size === 0) {
                    throw new Error('Tab dData không có thành viên hợp lệ để nối quan hệ mẹ.');
                }

                drawTree([...mainData.records.values()], [...motherData.records.values()]);

                const extraNotes = [];
                const skippedRows = mainData.skippedRows + motherData.skippedRows;
                const duplicateIds = mainData.duplicateIds + motherData.duplicateIds;
                if (skippedRows) extraNotes.push(`Bỏ qua ${skippedRows} dòng thiếu ID hoặc họ tên.`);
                if (duplicateIds) extraNotes.push(`Bỏ qua ${duplicateIds} dòng có ID trùng.`);
                if (extraNotes.length) {
                    noteElement.textContent = [noteElement.textContent, ...extraNotes].filter(Boolean).join(' ');
                }
            } catch (error) {
                statusElement.textContent = error.message || 'Đã xảy ra lỗi khi tải gia phả.';
                statusElement.className = 'error';
            }
        }

        document.getElementById('search-button').addEventListener('click', focusPerson);
        searchElement.addEventListener('keydown', event => {
            if (event.key === 'Enter') focusPerson();
        });
        document.getElementById('fit-button').addEventListener('click', () => {
            if (chartState) {
                chartState.svg.transition().duration(400).call(chartState.zoom.transform, d3.zoomIdentity);
            }
        });
        document.getElementById('zoom-in-button').addEventListener('click', () => {
            if (chartState) chartState.svg.transition().duration(250).call(chartState.zoom.scaleBy, 1.5);
        });
        document.getElementById('zoom-out-button').addEventListener('click', () => {
            if (chartState) chartState.svg.transition().duration(250).call(chartState.zoom.scaleBy, 1 / 1.5);
        });

        loadFamilyTree();
    </script>
</body>
</html>
